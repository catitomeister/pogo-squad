# Rebuilds the site data every 4 hours (and on push), commits it, and deploys to GitHub Pages.
name: Update and deploy

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      counters_ok: ${{ steps.build.outputs.counters_ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - id: build
        run: python build.py --site
      - name: Commit refreshed data
        run: |
          git config user.name "pogo-squad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "Update event data" && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # The site is already deployed by now. If the raid-counter source (Pokémon GO Hub) stopped
  # working, fail this job so GitHub sends a "Run failed" email; the site keeps the last good counters.
  verify:
    needs: [build, deploy]
    if: ${{ always() && needs.build.outputs.counters_ok == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Top counters could not be scraped from Pokémon GO Hub (page format may have changed). The site was still updated and shows the last good counters."
          exit 1
